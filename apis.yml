name: Verbal
description: Verbal (tryverbal.com) is an AI-powered clinical compliance and quality-assurance
  platform for healthcare organizations. It automatically audits patient interactions
  — phone and video calls, telehealth visits, AI-agent conversations, and clinical
  chart notes — against customizable regulatory and quality checklists, scoring compliance
  in real time and surfacing gaps for supervisors and QA teams. Verbal integrates with
  communications and EHR platforms including Zoom, Five9, Epic, and Athena. As of this
  enrichment pass the company publishes a marketing site and customer app but no public
  developer API, documentation, or developer portal. Backed by 500 Global.
