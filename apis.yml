name: Verbal
description: Verbal (tryverbal.com), from Salusive Health, is an AI-powered clinical
  compliance and quality-assurance platform for healthcare organizations. It automatically
  audits patient interactions — phone and video calls, telehealth visits, AI-agent
  conversations, and clinical chart notes — against customizable regulatory and quality
  checklists, scoring compliance in real time and surfacing gaps for supervisors and QA
  teams. Verbal connects to communications and EHR platforms including RingCentral, NICE,
  Zoom, Five9, Healthie, Epic, and Athena, and ships a Chrome extension for clinicians. It
  publishes a healthcare compliance posture — HIPAA compliant, HITRUST certified, CPRA,
  BAAs with all customers, PII redaction and US data residency. As of this enrichment pass
  the company exposes no public developer API — the API language on its site describes
  Verbal consuming partner platform APIs, not an API it publishes, and there is no
  developer portal, reference, machine-readable spec, or SDK on any Verbal host. Backed by
  500 Global.
